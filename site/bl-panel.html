<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BL Panel</title>
  <style>
    @import url('../assets/fonts/bl-fonts.css');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --white:       #ffffff;
      --blush:       #fce8ef;
      --petal:       #f9d0e0;
      --rose:        #f4a7c0;
      --dusty:       #e8c4d4;
      --gutter:      6px;
      --border:      3px;
    }

    html, body {
      width: 100%; height: 100%;
      background: var(--blush);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Nanum Myeongjo', serif;
      overflow: hidden;
    }

    /* ─── outer page shell ─── */
    .manga-page {
      position: relative;
      width: min(420px, 95vw);
      aspect-ratio: 9 / 16;
      background: var(--white);
      box-shadow: 0 8px 60px rgba(220, 140, 170, 0.45),
                  0 2px 16px rgba(220, 140, 170, 0.25);
      overflow: hidden;
    }

    /* ─── soft pink screentone overlay ─── */
    .manga-page::before {
      content: '';
      position: absolute; inset: 0; z-index: 10;
      background-image:
        radial-gradient(circle, rgba(250,180,200,0.18) 1px, transparent 1px);
      background-size: 10px 10px;
      pointer-events: none;
    }

    /* ─── dreamy top vignette ─── */
    .manga-page::after {
      content: '';
      position: absolute; inset: 0; z-index: 11;
      background: linear-gradient(
        to bottom,
        rgba(255,255,255,0.85) 0%,
        rgba(255,240,248,0.35) 18%,
        transparent 38%,
        transparent 72%,
        rgba(255,240,248,0.4) 88%,
        rgba(255,255,255,0.7) 100%
      );
      pointer-events: none;
    }

    /* ─── panel grid ─── */
    .panel-grid {
      display: grid;
      width: 100%; height: 100%;
      gap: var(--gutter);
      padding: var(--gutter);
      background: var(--petal);
      grid-template-columns: 46% 54%;
      grid-template-rows: 55% 45%;
    }

    /* ─── individual panels ─── */
    .panel {
      position: relative;
      overflow: hidden;
      border: var(--border) solid rgba(255,255,255,0.85);
      box-shadow:
        inset 0 0 12px rgba(255,255,255,0.4),
        0 0 0 1px rgba(240,190,210,0.5);
    }

    .panel img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.6s ease;
    }

    /* panel-specific crops */
    .p-main   img { object-position: center top;  }
    .p-door   img { object-position: center 15%; }
    .p-kiss   img { object-position: center 40%; }
    .p-glow   img { object-position: center 22%; }

    /* ─── per-panel colour washes ─── */
    .panel::after {
      content: '';
      position: absolute; inset: 0; z-index: 2;
      pointer-events: none;
    }

    /* main panel - faint warm blush */
    .p-main::after {
      background: linear-gradient(
        160deg,
        rgba(255,230,240,0.25) 0%,
        rgba(255,255,255,0.10) 60%,
        rgba(250,180,210,0.20) 100%
      );
    }

    /* door kiss - cool lavender tint */
    .p-door::after {
      background: linear-gradient(
        180deg,
        rgba(220,200,240,0.20) 0%,
        rgba(255,255,255,0.08) 100%
      );
    }

    /* KISS panel - keep its bold red; add just a whisper overlay */
    .p-kiss::after {
      background: linear-gradient(
        180deg,
        rgba(255,200,220,0.15) 0%,
        transparent 60%
      );
    }

    /* fireworks glow - warm highlight */
    .p-glow::after {
      background: linear-gradient(
        160deg,
        rgba(255,220,235,0.22) 0%,
        rgba(255,240,250,0.12) 100%
      );
    }

    /* ─── grid placement ─── */
    .p-main  { grid-column: 1; grid-row: 1; }
    .p-door  { grid-column: 2; grid-row: 1; }
    .p-kiss  { grid-column: 1; grid-row: 2; }
    .p-glow  { grid-column: 2; grid-row: 2; }

    /* ─── diagonal cut on main panel (manhwa style) ─── */
    .p-main {
      clip-path: polygon(0 0, 100% 0, 100% 88%, 84% 100%, 0 100%);
    }

    /* ─── angled cut on glow panel ─── */
    .p-glow {
      clip-path: polygon(16% 0, 100% 0, 100% 100%, 0 100%, 0 12%);
    }

    /* door panel — rectangular, no clip ─── */

    /* ─── sparkle & heart decorations ─── */
    .sparkles {
      position: absolute; inset: 0; z-index: 20;
      pointer-events: none;
      overflow: hidden;
    }

    .sparkle {
      position: absolute;
      opacity: 0;
      animation: sparkle-fade 3.2s ease-in-out infinite;
    }

    @keyframes sparkle-fade {
      0%, 100% { opacity: 0; transform: scale(0.4) rotate(0deg); }
      50%       { opacity: 1; transform: scale(1) rotate(20deg); }
    }

    /* positions & delays */
    .sparkle:nth-child(1)  { top: 5%;  left: 8%;  animation-delay: 0s;    }
    .sparkle:nth-child(2)  { top: 8%;  right: 9%; animation-delay: 0.5s;  }
    .sparkle:nth-child(3)  { top: 2%;  left: 48%; animation-delay: 1.1s;  }
    .sparkle:nth-child(4)  { top: 92%; left: 6%;  animation-delay: 0.3s;  }
    .sparkle:nth-child(5)  { top: 95%; right: 7%; animation-delay: 0.9s;  }
    .sparkle:nth-child(6)  { top: 48%; left: 3%;  animation-delay: 1.5s;  }
    .sparkle:nth-child(7)  { top: 50%; right: 3%; animation-delay: 0.7s;  }
    .sparkle:nth-child(8)  { top: 22%; left: 42%; animation-delay: 2.0s;  }
    .sparkle:nth-child(9)  { top: 72%; left: 38%; animation-delay: 1.7s;  }
    .sparkle:nth-child(10) { top: 35%; right: 6%; animation-delay: 2.4s;  }
    .sparkle:nth-child(11) { top: 18%; left: 22%; animation-delay: 0.2s;  }
    .sparkle:nth-child(12) { top: 80%; right: 22%; animation-delay: 1.3s; }

    /* ─── corner roses ─── */
    .corner-deco {
      position: absolute; z-index: 22;
      font-size: 22px;
      opacity: 0.55;
      filter: drop-shadow(0 1px 3px rgba(220,140,170,0.5));
      pointer-events: none;
      animation: float-gentle 4s ease-in-out infinite;
    }

    @keyframes float-gentle {
      0%, 100% { transform: translateY(0) rotate(-5deg); }
      50%       { transform: translateY(-4px) rotate(5deg); }
    }

    .corner-deco.tl { top: 8px;  left: 8px;  animation-delay: 0s;   }
    .corner-deco.tr { top: 8px;  right: 8px; animation-delay: 0.8s; }
    .corner-deco.bl { bottom: 8px; left: 8px;  animation-delay: 1.6s; }
    .corner-deco.br { bottom: 8px; right: 8px; animation-delay: 2.4s; }

    /* ─── gutter label (manhwa style SFX text) ─── */
    .sfx-text {
      position: absolute; z-index: 25;
      font-family: 'Noto Serif KR', serif;
      font-weight: 300;
      font-size: 9px;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: rgba(210, 120, 155, 0.7);
      pointer-events: none;
    }

    .sfx-top {
      top: 14px; left: 50%;
      transform: translateX(-50%);
      white-space: nowrap;
    }

    .sfx-bottom {
      bottom: 14px; left: 50%;
      transform: translateX(-50%);
      white-space: nowrap;
    }

    /* ─── panel highlight border flare ─── */
    .panel-flare {
      position: absolute; z-index: 3;
      inset: 0;
      pointer-events: none;
      box-shadow: inset 0 0 0 1.5px rgba(255,255,255,0.6);
    }

  </style>
</head>
<body>

<div class="manga-page">

  <!-- panel grid -->
  <div class="panel-grid">

    <!-- main panel: okah kiss — white space top bleeds into page (left col, top row) -->
    <div class="panel p-main">
      <img src="assets/bl-okah.png" alt=""/>
      <div class="panel-flare"></div>
    </div>

    <!-- door kiss (right col, top row) -->
    <div class="panel p-door">
      <img src="assets/bl-door.jpeg" alt=""/>
      <div class="panel-flare"></div>
    </div>

    <!-- KISS panel (left col, bottom row) -->
    <div class="panel p-kiss">
      <img src="assets/bl-kiss.jpeg" alt=""/>
      <div class="panel-flare"></div>
    </div>

    <!-- fireworks close-up — warm pink glow (right col, bottom row) -->
    <div class="panel p-glow">
      <img src="assets/bl-fireworks.webp" alt=""/>
      <div class="panel-flare"></div>
    </div>

  </div>

  <!-- screentone + vignette overlays (via ::before / ::after on .manga-page) -->

  <!-- sparkle stars -->
  <div class="sparkles" aria-hidden="true">
    <svg class="sparkle" width="18" height="18" viewBox="0 0 20 20">
      <path d="M10 0 L11.5 8.5 L20 10 L11.5 11.5 L10 20 L8.5 11.5 L0 10 L8.5 8.5Z" fill="#f9b8cf"/>
    </svg>
    <svg class="sparkle" width="14" height="14" viewBox="0 0 20 20">
      <path d="M10 0 L11.5 8.5 L20 10 L11.5 11.5 L10 20 L8.5 11.5 L0 10 L8.5 8.5Z" fill="#fad0e4"/>
    </svg>
    <svg class="sparkle" width="10" height="10" viewBox="0 0 20 20">
      <path d="M10 0 L11.5 8.5 L20 10 L11.5 11.5 L10 20 L8.5 11.5 L0 10 L8.5 8.5Z" fill="#ffffff"/>
    </svg>
    <svg class="sparkle" width="16" height="16" viewBox="0 0 20 20">
      <path d="M10 0 L11.5 8.5 L20 10 L11.5 11.5 L10 20 L8.5 11.5 L0 10 L8.5 8.5Z" fill="#f9b8cf"/>
    </svg>
    <svg class="sparkle" width="12" height="12" viewBox="0 0 20 20">
      <path d="M10 0 L11.5 8.5 L20 10 L11.5 11.5 L10 20 L8.5 11.5 L0 10 L8.5 8.5Z" fill="#fce8ef"/>
    </svg>
    <svg class="sparkle" width="8" height="8" viewBox="0 0 20 20">
      <path d="M10 0 L11.5 8.5 L20 10 L11.5 11.5 L10 20 L8.5 11.5 L0 10 L8.5 8.5Z" fill="#f4a7c0"/>
    </svg>
    <svg class="sparkle" width="10" height="10" viewBox="0 0 20 20">
      <path d="M10 0 L11.5 8.5 L20 10 L11.5 11.5 L10 20 L8.5 11.5 L0 10 L8.5 8.5Z" fill="#fce8ef"/>
    </svg>
    <!-- hearts -->
    <svg class="sparkle" width="14" height="14" viewBox="0 0 32 32">
      <path d="M16 28s-14-9-14-18a7 7 0 0 1 14 0 7 7 0 0 1 14 0c0 9-14 18-14 18z" fill="#f9b8cf"/>
    </svg>
    <svg class="sparkle" width="10" height="10" viewBox="0 0 32 32">
      <path d="M16 28s-14-9-14-18a7 7 0 0 1 14 0 7 7 0 0 1 14 0c0 9-14 18-14 18z" fill="#fad0e4"/>
    </svg>
    <svg class="sparkle" width="12" height="12" viewBox="0 0 32 32">
      <path d="M16 28s-14-9-14-18a7 7 0 0 1 14 0 7 7 0 0 1 14 0c0 9-14 18-14 18z" fill="#f4a7c0"/>
    </svg>
    <svg class="sparkle" width="8" height="8" viewBox="0 0 20 20">
      <path d="M10 0 L11.5 8.5 L20 10 L11.5 11.5 L10 20 L8.5 11.5 L0 10 L8.5 8.5Z" fill="#ffffff"/>
    </svg>
    <svg class="sparkle" width="16" height="16" viewBox="0 0 32 32">
      <path d="M16 28s-14-9-14-18a7 7 0 0 1 14 0 7 7 0 0 1 14 0c0 9-14 18-14 18z" fill="#fce8ef"/>
    </svg>
  </div>

  <!-- corner rose decorations -->
  <span class="corner-deco tl" aria-hidden="true">🌸</span>
  <span class="corner-deco tr" aria-hidden="true">✦</span>
  <span class="corner-deco bl" aria-hidden="true">✦</span>
  <span class="corner-deco br" aria-hidden="true">🌸</span>

  <!-- manhwa-style caption text -->
  <div class="sfx-text sfx-top"  aria-hidden="true">♡ &nbsp; innocent &nbsp; ♡</div>
  <div class="sfx-text sfx-bottom" aria-hidden="true">♡ &nbsp; 설레다 &nbsp; ♡</div>

</div>

</body>
</html>
